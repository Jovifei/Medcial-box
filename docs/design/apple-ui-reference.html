function renderPhone(s,p){let body=({home:home,plans,mine,detail,add,invite,trash,states:()=>home(homeState==='normal'?'empty':homeState)})[s]();let action=s==='home'||s==='states'?'<button class="primary" data-go="add">'+icon('plus','small-icon')+'录入药品</button>':s==='plans'?'<button class="primary" data-action="create-plan">'+icon('plus','small-icon')+'创建计划</button>':s==='detail'?'<div class="action-pair" style="margin:0"><button class="secondary" data-action="restock">补充库存</button><button class="primary" data-action="usage">记录使用</button></div>':s==='add'?'<button class="primary" data-action="save">保存药品</button>':'';return `<div class="phone ${largeText?'large':''}" data-phone="${s}"><div class="platform-bar"><span>${p==='app'?'APP':'微信小程序'}</span><span class="sample">示例数据</span></div>${nativeNav(s,p)}<main class="phone-body">${body}</main>${action?`<div class="bottom-action">${action}</div>`:''}${['home','plans','mine','states'].includes(s)?`<nav class="tabbar" aria-label="主导航">${[['home','box','药箱'],['plans','calendar','用药计划'],['mine','person','我的']].map(([target,ico,label])=>`<button data-go="${target}" class="${s===target||s==='states'&&target==='home'?'active':''}" ${s===target?'aria-current="page"':''}>${icon(ico)}<span>${label}</span></button>`).join('')}</nav>`:''}</div>`}
const guidance={home:['先回答“现在有什么要处理”','搜索、关注摘要和可读的当前筛选、排序与结果数放在清单前；连续列表只突出药名、余量、最早到期，已应用条件可直接清除。未知状态明确写“待核对”，不会默认显示正常。'],plans:['先看到今日，再管理计划','“今日安排 / 全部计划”分段切换。服药动作留在单条安排内，状态变化直接在原卡回显；纠正入口继续可用。'],mine:['低频能力按任务分组','家庭与照护、药箱工具、数据与账号分组展示。盘点、归档、最近删除保留清晰入口，避免藏在一个含糊的“更多”里。'],detail:['信息先行，动作靠近拇指','最早效期说明与批次入口相邻；补充库存和记录使用是主要动作。编辑信息留在导航栏，危险动作通过菜单和确认完成。'],add:['让首次录入更轻','药名为必填；规格、数量、日期、位置选填。拍照和条码是录入加速方式，识别结果必须经过核对，保存前不能冒充真实库存。'],invite:['分享前说明加入的范围','突出家庭名称、角色、有效期和一次性语义。小程序使用微信原生分享，App 使用平台分享能力；确认加入前再显示家庭名称。'],trash:['恢复动作和记录放在一起','同时展示记录类型、删除日期和保留至日期；恢复后给出回药箱入口。归档、删除、过期处置是不同业务动作。'],states:['无内容和加载失败分开','空药箱引导录入；加载失败解释当前状态并提供重试。不会将请求失败显示成“没有药品”，避免用户误以为数据丢失。']};
function render(){document.body.className='platform-'+platform+(dark?' dark':'');document.documentElement.style.setProperty('--device-width',deviceWidth+'px');const root=document.getElementById('root');if(board){const list=platform==='app'?['home','plans','mine','detail']:['home','add','invite','trash'];root.innerHTML=`<div class="board-wrap"><div class="board-heading"><div><div class="brand">小药箱 / 交互设计参考</div><h1>${platform==='app'?'App · 内容清晰，操作顺手':'微信小程序 · 相同语言，适配原生容器'}</h1></div><p>main 3a9afef 的功能基线 · 静态示例 · 2026.11.09</p></div><div class="board">${list.map((s,i)=>`<section><div class="board-title">0${i+1} / ${screens.find(x=>x[0]===s)[1]}</div>${renderPhone(s,platform)}</section>`).join('')}</div></div>`;return}root.innerHTML=`<div class="studio"><div class="top"><div><div class="brand">小药箱 / 交互设计参考</div><h1>让家庭药箱更容易使用</h1><p class="intro">延续已确认的三栏导航、品牌绿与中文紧凑字号，用清晰分组和可预期的操作，让两端各自适配。</p></div><div class="switch" aria-label="平台"><button data-platform="app" aria-pressed="${platform==='app'}">App</button><button data-platform="mini" aria-pressed="${platform==='mini'}">小程序</button></div></div><div class="preview-tools" aria-label="预览设置"><button data-size="390" aria-pressed="${deviceWidth===390}">390 宽</button><button data-size="320" aria-pressed="${deviceWidth===320}">320 宽</button><button data-appearance aria-pressed="${dark}">${dark?'浅色模式':'深色模式'}</button><button data-text-scale aria-pressed="${largeText}">${largeText?'标准文字':'200% 文字'}</button></div><div class="workbench"><nav class="rail" aria-label="参考页面"><h2>关键页面</h2>${screens.map(([s,t],i)=>`<button data-go="${s}" aria-current="${screen===s}"><span style="opacity:.5;margin-right:10px">0${i+1}</span>${t}</button>`).join('')}<small>这是可点击的设计参考。<br>全部为示例数据，不连接真实服务，也不创建或修改任何家庭记录。</small></nav>${renderPhone(screen,platform)}<aside class="notes"><div class="note"><h2>本页交互</h2><h3>${guidance[screen][0]}</h3><p>${guidance[screen][1]}</p>${['home','states'].includes(screen)?`<div class="state-control"><button class="${homeState==='normal'?'active':''}" data-state="normal">有库存</button><button class="${homeState==='empty'?'active':''}" data-state="empty">空药箱</button><button class="${homeState==='error'?'active':''}" data-state="error">加载失败</button><button class="${homeState==='cached'?'active':''}" data-state="cached">缓存更新失败</button></div>`:''}</div><div class="note"><h2>平台适配</h2><h3>${platform==='app'?'保留平台返回与安全区':'尊重微信原生导航'}</h3><p>${platform==='app'?'App 采用 Cupertino 导航和系统式分组列表。导航材质可轻度半透明，内容卡片保持实色，Android 返回键行为保持可预测。':'微信顶部栏与胶囊由微信负责。页面不复刻 iOS 状态栏；业务区使用一致的语义色、圆角、间距，分享使用微信原生能力。'}</p></div><div class="note"><h2>共同约束</h2><ul><li>主操作目标 48 × 48，最低遵守 44 × 44。</li><li>保留 28 / 24 / 20 / 18 / 16 / 15 的中文紧凑字号阶梯。</li><li>语义色同时配文字；过期不能只靠红色。</li><li>字号放大后优先换行和纵向排列。</li></ul></div></aside></div><div class="footnotes">范围说明：此参考用于本次 UI 分支实现对齐，并非现有页面截图或已验收成品。Figma 文件创建成功，但设计编辑因 Starter 调用额度被拒绝，尚未写入设计；本地参考已独立提供。<br><a href="https://developer.apple.com/design/human-interface-guidelines/materials" target="_blank" rel="noreferrer">Apple：材质</a> · <a href="https://developer.apple.com/design/human-interface-guidelines/tab-bars" target="_blank" rel="noreferrer">导航栏</a> · <a href="https://developer.apple.com/design/human-interface-guidelines/buttons" target="_blank" rel="noreferrer">按钮</a> · <a href="https://developer.apple.com/help/app-store-connect/manage-app-accessibility/larger-text-evaluation-criteria" target="_blank" rel="noreferrer">大字号验证</a></div></div>`}
function toast(msg,phone){const p=phone||document.querySelector('.phone');p.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.role='status';el.textContent=msg;p.appendChild(el);setTimeout(()=>el.remove(),4200)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const p=b.closest('.phone');if(b.dataset.size){deviceWidth=Number(b.dataset.size);render();return}if(b.hasAttribute('data-appearance')){dark=!dark;render();return}if(b.hasAttribute('data-text-scale')){largeText=!largeText;render();return}if(b.dataset.platform){platform=b.dataset.platform;render();return}if(b.dataset.go){if(screens.some(x=>x[0]===b.dataset.go)){screen=b.dataset.go;if(board){toast('交互版中可进入「'+screens.find(x=>x[0]===screen)[1]+'」。请移除 URL 中的 ?board 参数。',p)}else render()}else toast('该入口已保留。完整功能由实际客户端提供，本参考不连接业务数据。',p);return}if(b.dataset.state){homeState=b.dataset.state;if(screen==='states'&&homeState==='normal')screen='home';render();return}if(b.dataset.filter){filter=b.dataset.filter;render();return}const a=b.dataset.action;if(a==='previous-day'||a==='next-day'){dayOffset+=a==='previous-day'?-1:1;render();return}if(a==='back-today'){dayOffset=0;render();return}if(a==='today'||a==='all-plans'){planView=a==='today'?'today':'all';render();return}if(a==='clear-filter'){filter='all';render();return}if(a==='retry'){homeState='normal';screen='home';render();return}if(a==='taken'||a==='skip'){doseDone=true;render();toast(a==='taken'?'本次示例已记录为“已服用”。':'本次示例已记录为“跳过”。');return}if(a==='correct'){doseDone=false;render();toast('已打开可纠正状态；实际客户端保留操作历史。');return}if(a==='restore'){restored=true;render();return}if(a==='save'){const input=p.querySelector('#drug-name');if(!input.value.trim()){input.focus();toast('请先填写药品名称。',p);return}medicines.unshift({name:input.value.trim(),spec:p.querySelector('#drug-spec').value.trim()||'规格待补充',qty:p.querySelector('#drug-qty').value.trim()||'待核对',expiry:p.querySelector('#drug-expiry').value||'日期待补充',badge:'资料待完善',tone:'',location:p.querySelector('#drug-place').value.trim()||'位置待补充'});saved=true;screen='home';homeState='normal';render();return}const messages={attention:'可分别处理临期、过期、库存不足和资料待完善；本参考用筛选呈现。','scan-photo':'拍照识别 → 核对药名、规格和识别证据 → 确认后保存。','scan-code':'条码查询 → 选择匹配药品 → 核对后补充自己的库存。','create-plan':'创建计划需选择照护对象并填写已有医嘱信息；本参考不生成用药建议。',share:'实际小程序调用微信原生分享，App 使用平台分享；此页不发送邀请。',copy:'这里只是示例邀请码，未写入系统剪贴板。',usage:'实际使用记录先选择批次和数量，再确认扣减库存。',restock:'补充库存应新增或更新批次，保留原批次日期和变更历史。',sort:'当前示例按最早效期排序，实际客户端保留已有排序选项。','all-plans':'全部计划保留进行中、暂停和结束筛选；历史记录不会被删除。','previous-day':'日期切换查看对应日期，当前参考保持示例日期。','next-day':'日期切换查看对应日期，当前参考保持示例日期。'};if(a==='attention'){filter='expiry';render()}toast(messages[a]||'该操作由实际客户端处理，此处展示交互意图。',p&&!board?undefined:p)});
document.addEventListener('change',e=>{if(e.target.matches('[data-filter-select]')){filter=e.target.value;render()}});document.addEventListener('input',e=>{if(!e.target.matches('[data-search]'))return;const value=e.target.value.trim().toLowerCase();const list=e.target.closest('.phone').querySelector('#medicine-list');if(!list)return;const result=medicines.filter(m=>(filter==='all'||filter==='expiry'&&m.tone==='warning'||filter==='low'&&m.low===true)&&(m.name+m.spec+m.location).toLowerCase().includes(value));const count=e.target.closest('.phone').querySelector('#result-count');if(count)count.textContent=result.length+' 种药品';list.innerHTML=result.length?result.map(medicine).join(''):'<div class="no-results">没有匹配结果，请试试其他药名或位置。</div>'});render();
</script>
