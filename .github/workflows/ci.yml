name: CI

on:
  push:
    branches: [main, "codex/**", "audit/**"]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: medbox_ci
          POSTGRES_USER: medbox_ci
          POSTGRES_PASSWORD: ephemeral_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medbox_ci -d medbox_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgres://medbox_ci:ephemeral_ci_only@127.0.0.1:5432/medbox_ci
      REQUIRE_POSTGRES_TESTS: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Frozen historical QA source must be available to deterministic tests.
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Freeze tracked review source before regression execution
        run: |
          git archive --format=tar --output="$RUNNER_TEMP/review-source.tar" HEAD apps/api apps/miniprogram apps/flutter/lib 'apps/flutter/test/*.dart' scripts packages package.json package-lock.json VERSION.json
      - uses: actions/upload-artifact@v6
        with:
          name: medbox-review-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/review-source.tar
          if-no-files-found: error
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:miniprogram:source
      - name: Freeze and exercise exact mini source QA
        run: |
          npm run prepare:mini:qa -- --source-sha "$(git rev-parse HEAD)" --output var/family-pilot-mini --run-id family-pilot
          npm run test:mini:qa

      - uses: actions/upload-artifact@v6
        with:
          name: family-pilot-upgrade-mini-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            var/family-pilot-upgrade/
            var/family-pilot-mini/
          if-no-files-found: error

  backup-docker:
    # Disposable synthetic resources only; no deployment environment or secrets.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Exercise isolated staging backup and restore
        run: node scripts/test-staging-backup-docker.mjs
      - name: Reject wrong deployment identities and exercise an isolated API replacement
        run: node scripts/test-deployment-guard-docker.mjs
      - uses: actions/upload-artifact@v6
        with:
          name: family-pilot-backup-${{ github.event.pull_request.head.sha || github.sha }}
          path: var/family-pilot-backup/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        with:
          name: family-pilot-deployment-guard-${{ github.event.pull_request.head.sha || github.sha }}
          path: var/deployment-guard/
          if-no-files-found: error

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      # Technical optimizer gate only. Source control intentionally has no distribution signing key.
      - name: Build optimized unsigned release APK
        run: flutter build apk --release

  candidate-delivery:
    # Offline source artifact only: no deployment credentials, API traffic or platform upload.
    needs: [verify, backup-docker, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MEDBOX_JOB_RESULTS: '{"verify":"${{ needs.verify.result }}","backup-docker":"${{ needs.backup-docker.result }}","flutter":"${{ needs.flutter.result }}"}'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build and verify exact-source HTTPS candidate without contacting its API
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          node scripts/candidate-bundle.mjs build --sha "$CANDIDATE_SHA" --appid wx1f6dd99d28aab8e5 --api-base https://medbox.joviluma.com --output var/candidate-delivery/bundle
          node scripts/candidate-bundle.mjs verify --sha "$CANDIDATE_SHA" --appid wx1f6dd99d28aab8e5 --api-base https://medbox.joviluma.com --output var/candidate-delivery/bundle
          node scripts/candidate-bundle.mjs receipt --sha "$CANDIDATE_SHA" --output var/candidate-delivery/ci-receipt.json
          node scripts/candidate-readiness.mjs --manifest var/candidate-delivery/bundle/manifest.json --receipt var/candidate-delivery/ci-receipt.json --output var/candidate-delivery/release-readiness.json
      - uses: actions/upload-artifact@v6
        with:
          name: medbox-source-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: var/candidate-delivery/
          if-no-files-found: error
