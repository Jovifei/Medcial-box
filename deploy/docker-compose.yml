services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medbox}
      POSTGRES_USER: ${POSTGRES_USER:-medbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 迁移统一由 API 启动时的迁移器执行（schema_migrations 台账防重复/防篡改）；
    # 不要把迁移 SQL 挂到 /docker-entrypoint-initdb.d——initdb 不登记迁移记录，
    # 会导致应用迁移器二次执行建表脚本并因表已存在而启动失败。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 3000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-medbox}:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/${POSTGRES_DB:-medbox}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/v1/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
