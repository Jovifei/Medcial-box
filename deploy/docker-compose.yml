services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medbox}
      POSTGRES_USER: ${POSTGRES_USER:-medbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # 迁移统一由 API 启动时的迁移器执行（schema_migrations 台账防重复/防篡改）；
    # 不要把迁移 SQL 挂到 /docker-entrypoint-initdb.d——initdb 不登记迁移记录，
    # 会导致应用迁移器二次执行建表脚本并因表已存在而启动失败。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      API_PORT: 3000
      API_HOST: 0.0.0.0
      DATABASE_URL: postgres://${POSTGRES_USER:-medbox}:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/${POSTGRES_DB:-medbox}
      WECHAT_APP_ID: ${WECHAT_APP_ID:-}
      WECHAT_APP_SECRET: ${WECHAT_APP_SECRET:-}
      MEDICINE_RECOGNITION_PROVIDER: ${MEDICINE_RECOGNITION_PROVIDER:-dashscope}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:0.8b}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_MODEL: ${DASHSCOPE_MODEL:-qwen3-vl-flash}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      JISU_MEDICINE_API_KEY: ${JISU_MEDICINE_API_KEY:-}
      WECHAT_REMINDER_TEMPLATE_ID: ${WECHAT_REMINDER_TEMPLATE_ID:-}
      WECHAT_REMINDER_FIELD_MAP: ${WECHAT_REMINDER_FIELD_MAP:-}
      WECHAT_REMINDER_SCHEDULER_ENABLED: ${WECHAT_REMINDER_SCHEDULER_ENABLED:-false}
      # 服药提醒（R4）：与库存提醒分开的模板与调度开关；模板未配置时调度不启动。
      WECHAT_DOSE_REMINDER_TEMPLATE_ID: ${WECHAT_DOSE_REMINDER_TEMPLATE_ID:-}
      WECHAT_DOSE_REMINDER_FIELD_MAP: ${WECHAT_DOSE_REMINDER_FIELD_MAP:-}
      WECHAT_DOSE_REMINDER_SCHEDULER_ENABLED: ${WECHAT_DOSE_REMINDER_SCHEDULER_ENABLED:-false}
      WECHAT_MINIPROGRAM_STATE: ${WECHAT_MINIPROGRAM_STATE:-developer}
      PRIVATE_UPLOAD_DIR: /var/lib/medbox/private-uploads
    volumes:
      - private_uploads:/var/lib/medbox/private-uploads
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/v1/health/ready >/dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
  private_uploads:
